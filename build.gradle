plugins {
    id 'java'
    id 'application'
}

// Project coordinates
group = 'com.acnweze'
version = '1.0.0'

// Use JDK 21, which is supported by current Gradle releases and IntelliJ IDEA.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Main.java is in src/main/java and does not declare a package.
application {
    mainClass = 'Main'
}
